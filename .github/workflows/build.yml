name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra build

      - name: Run tests
        run: uv run python -m unittest discover -s tests -t . -v

      - name: Build executable
        run: uv run --extra build pyinstaller --noconfirm --onefile --windowed --name ManiaDL maniadl.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManiaDL
          path: dist/ManiaDL.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ManiaDL.exe
          generate_release_notes: true
